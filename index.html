<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學堂：繁體中文挑戰！</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdfa; /* Light teal background fallback */
            background-image: radial-gradient(#bae6fd 20%, transparent 20%),
                              radial-gradient(#fed7aa 20%, transparent 20%);
            background-color: #fdf4ff;
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
        }

        /* Custom Animations */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 3D Button styles generated via JS, but base transitions defined here */
        .quiz-btn {
            transition: all 0.15s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Hero Section / Header -->
    <header class="text-center mb-8 animate-pop-in relative z-10">
        <div class="inline-block bg-white px-6 py-2 rounded-full shadow-md mb-3 border-2 border-pink-200">
            <span class="text-pink-500 font-bold tracking-widest text-sm">CHINESE QUIZ</span>
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-indigo-900 drop-shadow-sm mb-2">
            ✏️ 小學堂：中文挑戰！
        </h1>
        <p class="text-indigo-600 font-bold text-lg">看看你能答對幾題呢？</p>
    </header>

    <!-- Main Quiz Container -->
    <main class="w-full max-w-2xl relative z-10">
        <!-- Card -->
        <div id="quiz-card" class="bg-white rounded-[2rem] shadow-2xl p-6 md:p-10 border-4 border-white/50 backdrop-blur-sm relative overflow-hidden animate-pop-in">
            
            <!-- Decorative Elements -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-50"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-50"></div>

            <!-- Progress Indicator -->
            <div class="flex justify-center items-center space-x-2 mb-8 relative z-10" id="progress-dots">
                <!-- Dots injected by JS -->
            </div>

            <!-- Question Area -->
            <div class="relative z-10 text-center mb-8 min-h-[5rem] flex items-center justify-center">
                <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed">
                    載入題目中...
                </h2>
            </div>

            <!-- Options Area -->
            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 relative z-10">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </main>

    <!-- Result Lightbox Modal (Strict adherence to inline style for visibility toggling) -->
    <div id="result-modal" style="display: none;" class="fixed inset-0 bg-indigo-900/60 z-50 items-center justify-center backdrop-blur-sm p-4">
        <div id="modal-content" class="bg-white rounded-[2.5rem] p-8 md:p-12 w-full max-w-md text-center shadow-2xl transform scale-95 transition-transform duration-300 relative">
            
            <!-- Confetti/Star SVG Decoration -->
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2">
                <div class="w-24 h-24 bg-yellow-400 rounded-full flex items-center justify-center border-4 border-white shadow-lg text-4xl">
                    🏆
                </div>
            </div>

            <h3 class="text-3xl font-black text-indigo-900 mt-8 mb-2">測驗完成！</h3>
            
            <div class="my-6">
                <p class="text-gray-500 font-bold mb-1">你的最終分數</p>
                <div class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-orange-400 flex justify-center items-baseline space-x-2">
                    <span id="final-score">0</span>
                    <span class="text-3xl text-gray-300">/ 5</span>
                </div>
            </div>

            <div id="stars-container" class="flex justify-center space-x-2 text-4xl mb-4">
                <!-- Stars injected by JS -->
            </div>

            <p id="feedback-message" class="text-xl font-bold text-gray-700 mb-8 h-12 flex items-center justify-center">
                評語
            </p>

            <button onclick="resetQuiz()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold text-xl py-4 rounded-2xl shadow-[0_6px_0_0_#4c1d95] hover:shadow-[0_4px_0_0_#4c1d95] hover:translate-y-[2px] active:shadow-[0_0_0_0_#4c1d95] active:translate-y-[6px] transition-all">
                🔄 再玩一次
            </button>
        </div>
    </div>

    <script>
        // --- Quiz Data ---
        // 5 questions suitable for elementary level (Taiwan Traditional Chinese)
        const originalQuizData = [
            {
                question: "請選出正確的字：「他每天都很認真溫習（　）課。」",
                options: ["空", "功", "攻", "弓"],
                answerIndex: 1
            },
            {
                question: "「蘋果」的「蘋」注音怎麼拼？",
                options: ["ㄆㄧㄥ", "ㄆㄧㄥˊ", "ㄆㄧㄣˊ", "ㄅㄧㄥˊ"],
                answerIndex: 1
            },
            {
                question: "「花」字的部首是哪一個？",
                options: ["木部", "艸部", "水部", "十部"],
                answerIndex: 1
            },
            {
                question: "請選出沒有錯別字的詞語：",
                options: ["辛古", "辛苦", "幸苦", "辛若"],
                answerIndex: 1
            },
            {
                question: "填入正確的動物完成成語：「九（　）一毛」",
                options: ["狗", "羊", "豬", "牛"],
                answerIndex: 3
            }
        ];

        // --- State Variables ---
        let currentQuizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswering = false; // Prevent multiple clicks

        // --- DOM Elements ---
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressDotsContainer = document.getElementById('progress-dots');
        const quizCard = document.getElementById('quiz-card');
        const modal = document.getElementById('result-modal');
        const modalContent = document.getElementById('modal-content');
        const finalScoreEl = document.getElementById('final-score');
        const starsContainer = document.getElementById('stars-container');
        const feedbackMessageEl = document.getElementById('feedback-message');

        // --- Utility Functions ---

        // Shuffle an array (Fisher-Yates)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Prepare quiz data (shuffle questions and options for replayability)
        function prepareQuizData() {
            // Optional: Shuffle questions themselves (uncomment below if desired)
            // const shuffledQuestions = shuffleArray(originalQuizData);
            const shuffledQuestions = [...originalQuizData]; 

            return shuffledQuestions.map(q => {
                const correctOptionText = q.options[q.answerIndex];
                const shuffledOptions = shuffleArray(q.options);
                const newAnswerIndex = shuffledOptions.indexOf(correctOptionText);
                return {
                    question: q.question,
                    options: shuffledOptions,
                    answerIndex: newAnswerIndex
                };
            });
        }

        // --- Core Logic ---

        function initQuiz() {
            currentQuizData = prepareQuizData();
            currentQuestionIndex = 0;
            score = 0;
            isAnswering = false;
            
            // Explicitly set inline style to hide modal
            modal.style.display = 'none';
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            loadQuestion();
        }

        function updateProgress() {
            progressDotsContainer.innerHTML = '';
            const totalQuestions = currentQuizData.length;
            
            for (let i = 0; i < totalQuestions; i++) {
                const dot = document.createElement('div');
                if (i === currentQuestionIndex) {
                    // Current dot
                    dot.className = 'w-8 h-3 rounded-full bg-pink-500 transition-all duration-300 shadow-sm';
                } else if (i < currentQuestionIndex) {
                    // Completed dot
                    dot.className = 'w-3 h-3 rounded-full bg-indigo-300 transition-all duration-300';
                } else {
                    // Future dot
                    dot.className = 'w-3 h-3 rounded-full bg-gray-200 transition-all duration-300';
                }
                progressDotsContainer.appendChild(dot);
            }
        }

        function loadQuestion() {
            isAnswering = false;
            const currentQ = currentQuizData[currentQuestionIndex];
            
            // Animation reset
            quizCard.classList.remove('animate-pop-in');
            void quizCard.offsetWidth; // Trigger reflow
            quizCard.classList.add('animate-pop-in');

            // Update UI
            updateProgress();
            questionTextEl.textContent = currentQ.question;
            optionsContainer.innerHTML = '';

            // Generate Buttons
            currentQ.options.forEach((optionText, index) => {
                const btn = document.createElement('button');
                // Base cute 3D styling
                btn.className = `quiz-btn w-full text-xl md:text-2xl font-bold py-4 px-6 rounded-[1.5rem] bg-white border-4 border-indigo-100 text-indigo-700 shadow-[0_6px_0_0_#e0e7ff] hover:bg-indigo-50 hover:shadow-[0_4px_0_0_#e0e7ff] hover:translate-y-[2px] active:shadow-[0_0_0_0_#e0e7ff] active:translate-y-[6px] outline-none`;
                btn.textContent = optionText;
                
                btn.onclick = () => handleAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, clickedButton) {
            if (isAnswering) return;
            isAnswering = true;

            const currentQ = currentQuizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQ.answerIndex;
            const allButtons = optionsContainer.querySelectorAll('button');

            if (isCorrect) {
                score++;
                // Correct styling
                clickedButton.className = `quiz-btn w-full text-xl md:text-2xl font-bold py-4 px-6 rounded-[1.5rem] bg-green-400 border-4 border-green-500 text-white shadow-[0_6px_0_0_#16a34a] translate-y-[2px] shadow-[0_4px_0_0_#16a34a]`;
                createParticles(clickedButton); // Extra fun effect
            } else {
                // Wrong styling
                clickedButton.className = `quiz-btn w-full text-xl md:text-2xl font-bold py-4 px-6 rounded-[1.5rem] bg-red-400 border-4 border-red-500 text-white shadow-[0_6px_0_0_#dc2626] animate-shake`;
                
                // Show actual correct answer
                const correctButton = allButtons[currentQ.answerIndex];
                setTimeout(() => {
                    correctButton.className = `quiz-btn w-full text-xl md:text-2xl font-bold py-4 px-6 rounded-[1.5rem] bg-green-300 border-4 border-green-400 text-green-900 shadow-[0_6px_0_0_#4ade80] transition-all duration-500`;
                }, 300);
            }

            // Disable all buttons
            allButtons.forEach(btn => {
                btn.onclick = null;
                btn.style.cursor = 'default';
                // Remove hover effects visually for unclicked buttons
                if(btn !== clickedButton && btn !== allButtons[currentQ.answerIndex]) {
                   btn.classList.add('opacity-50');
                }
            });

            // Move to next question or show result
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500); // 1.5s delay to see the result
        }

        function showResult() {
            finalScoreEl.textContent = score;
            
            // Calculate Stars and Comment
            let starsHTML = '';
            let message = '';
            
            if (score === 5) {
                starsHTML = '⭐⭐⭐⭐⭐';
                message = '太棒了！你是國語小天才！🏆';
            } else if (score >= 3) {
                starsHTML = '⭐⭐⭐⭐';
                message = '表現得很好喔！繼續保持！👍';
            } else if (score >= 1) {
                starsHTML = '⭐⭐⭐';
                message = '還不錯，再多練習一下會更好！💪';
            } else {
                starsHTML = '⭐';
                message = '加油加油！多看書會越來越厲害喔！📚';
            }

            starsContainer.innerHTML = starsHTML;
            feedbackMessageEl.textContent = message;

            // Show Modal - Explicit inline style as requested
            modal.style.display = 'flex';
            
            // Slight delay for pop animation of modal content
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        // Allow clicking background overlay to reset/close
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                resetQuiz();
            }
        });

        // Expose reset function to button
        window.resetQuiz = function() {
            initQuiz();
        };

        // --- Visual Effects (Optional Fun) ---
        function createParticles(element) {
            // Simple visual feedback using DOM elements temporarily
            const rect = element.getBoundingClientRect();
            for(let i=0; i<5; i++) {
                const particle = document.createElement('div');
                particle.innerHTML = '✨';
                particle.style.position = 'fixed';
                particle.style.left = (rect.left + rect.width / 2) + 'px';
                particle.style.top = (rect.top + rect.height / 2) + 'px';
                particle.style.fontSize = '24px';
                particle.style.pointerEvents = 'none';
                particle.style.transition = 'all 0.8s cubic-bezier(0.1, 0.8, 0.3, 1)';
                particle.style.zIndex = '100';
                
                document.body.appendChild(particle);

                // Random directions
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                setTimeout(() => {
                    particle.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
                    particle.style.opacity = '0';
                }, 10);

                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        // --- Initialization ---
        window.onload = () => {
            initQuiz();
        };
    </script>
</body>
</html>
